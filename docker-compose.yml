services:
  db:
    image: postgis/postgis:17-3.5
    container_name: xtrail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - xtrail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volume: data lives inside Docker's own storage, not in the repo — nothing here ever
# needs a .gitignore entry, and `docker compose down` (without -v) leaves it untouched.
volumes:
  xtrail_postgres_data:
    name: xtrail_postgres_data
